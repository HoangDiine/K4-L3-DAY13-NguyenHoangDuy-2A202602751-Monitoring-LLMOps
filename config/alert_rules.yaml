alerts:
  - name: HighResponseLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-1-high-response-latency

  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: llmops-oncall
    runbook: docs/alerts.md#alert-2-high-request-error-rate

  - name: LowRetrievalSuccessRate
    severity: warning
    condition: retrieval_success_rate_pct < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: rag-team
    runbook: docs/alerts.md#alert-3-low-retrieval-success-rate
